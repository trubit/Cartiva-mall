<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full bleed background for maskable safe area (80% diameter center safe zone) -->
  <rect width="512" height="512" fill="#0B2150"/>
  <g transform="translate(106, 106) scale(3.0)">
    <!-- C arc: 290° sweep -->
    <path
      d="M 82.77 27.06 A 40 40 0 1 0 82.77 72.94"
      stroke="#E8A020"
      stroke-width="9"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Cart-wheel dots -->
    <circle cx="82.77" cy="27.06" r="6.5" fill="#F5C86A"/>
    <circle cx="82.77" cy="72.94" r="6.5" fill="#F5C86A"/>
    <!-- Chevron arrow -->
    <path
      d="M 36.4 34.8 L 51.6 50 L 36.4 65.2"
      stroke="#F5C86A"
      stroke-width="7.7"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
      opacity="0.9"
    />
  </g>
</svg>
