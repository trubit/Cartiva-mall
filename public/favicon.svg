<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rounded square background -->
  <rect width="100" height="100" rx="20" fill="#0B2150"/>

  <!--
    C arc: 290° sweep opening at 3 o'clock ±35°
    r=40, cx=50, cy=50
    arcStart = (50 + 40·cos(-35°), 50 + 40·sin(-35°)) ≈ (82.77, 27.06)
    arcEnd   = (50 + 40·cos( 35°), 50 + 40·sin( 35°)) ≈ (82.77, 72.94)
    large-arc=1, sweep=0 → counter-clockwise 290°
  -->
  <path
    d="M 82.77 27.06 A 40 40 0 1 0 82.77 72.94"
    stroke="#E8A020"
    stroke-width="9"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Cart-wheel dots at the open ends -->
  <circle cx="82.77" cy="27.06" r="6.5" fill="#F5C86A"/>
  <circle cx="82.77" cy="72.94" r="6.5" fill="#F5C86A"/>

  <!--
    Chevron arrow pointing right, centred inside the C
    aX = 50 - 6 = 44, arrowSize = 40 × 0.38 = 15.2
    M (44-7.6, 50-15.2) L (44+7.6, 50) L (44-7.6, 50+15.2)
  -->
  <path
    d="M 36.4 34.8 L 51.6 50 L 36.4 65.2"
    stroke="#F5C86A"
    stroke-width="7.7"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    opacity="0.85"
  />
</svg>
