<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B2150" />
    <title>Offline — Cartiva Mall</title>
    <style>
      :root {
        --color-brand-navy: #0B2150;
        --color-brand-navy-light: #162B5E;
        --color-brand-gold: #E8A020;
        --color-brand-gold-light: #F5C86A;
        --color-text-primary: #FFFFFF;
        --color-text-secondary: rgba(255, 255, 255, 0.7);
        --color-surface: rgba(255, 255, 255, 0.05);
        --color-border: rgba(255, 255, 255, 0.12);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--color-brand-navy);
        color: var(--color-text-primary);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        padding: 1.5rem;
        text-align: center;
      }

      .offline-card {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 20px;
        padding: 2.5rem 2rem;
        max-width: 440px;
        width: 100%;
        backdrop-filter: blur(12px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      }

      .logo-mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 1.5rem auto;
        display: block;
      }

      .title {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 0.75rem;
        color: var(--color-text-primary);
      }

      .subtitle {
        font-size: 0.95rem;
        color: var(--color-text-secondary);
        line-height: 1.5;
        margin-bottom: 1.75rem;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(232, 160, 32, 0.15);
        border: 1px solid rgba(232, 160, 32, 0.3);
        color: var(--color-brand-gold);
        padding: 6px 14px;
        border-radius: 9999px;
        font-size: 0.8rem;
        font-weight: 600;
        margin-bottom: 1.75rem;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: var(--color-brand-gold);
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }

      .retry-btn {
        width: 100%;
        background: linear-gradient(135deg, #E8A020 0%, #D89015 100%);
        color: #0B2150;
        border: none;
        border-radius: 12px;
        padding: 0.875rem 1.5rem;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .retry-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 20px rgba(232, 160, 32, 0.35);
      }

      .retry-btn:active {
        transform: translateY(0);
      }

      .note {
        margin-top: 1.5rem;
        font-size: 0.8rem;
        color: var(--color-text-secondary);
      }
    </style>
  </head>
  <body>
    <div class="offline-card">
      <svg class="logo-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
        <rect width="100" height="100" rx="20" fill="#162B5E"/>
        <path
          d="M 82.77 27.06 A 40 40 0 1 0 82.77 72.94"
          stroke="#E8A020"
          stroke-width="9"
          stroke-linecap="round"
          fill="none"
        />
        <circle cx="82.77" cy="27.06" r="6.5" fill="#F5C86A"/>
        <circle cx="82.77" cy="72.94" r="6.5" fill="#F5C86A"/>
        <path
          d="M 36.4 34.8 L 51.6 50 L 36.4 65.2"
          stroke="#F5C86A"
          stroke-width="7.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"
          opacity="0.9"
        />
      </svg>

      <div class="status-pill">
        <span class="status-dot"></span>
        Waiting for internet connection
      </div>

      <h1 class="title">You're Offline</h1>
      <p class="subtitle">
        It looks like your network connection was lost. Cartiva Mall will automatically restore your session as soon as you are reconnected.
      </p>

      <button class="retry-btn" onclick="retryConnection()">Check Connection Again</button>

      <p class="note">Any items placed in your offline cart will sync when you are back online.</p>
    </div>

    <script>
      function retryConnection() {
        if (navigator.onLine) {
          window.location.reload();
        } else {
          var btn = document.querySelector('.retry-btn');
          btn.textContent = 'Still Offline... Retrying';
          setTimeout(function() {
            btn.textContent = 'Check Connection Again';
          }, 1500);
        }
      }

      window.addEventListener('online', function() {
        window.location.reload();
      });
    </script>
  </body>
</html>
