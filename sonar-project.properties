# ==============================================================================
# SonarQube / SonarCloud Project Configuration
# Cartiva Mall E-Commerce Platform
# ==============================================================================

sonar.projectKey=cartiva-mall
sonar.projectName=Cartiva Mall E-Commerce Platform
sonar.projectVersion=1.0.0

# Source & Test paths
sonar.sources=src,server/src
sonar.tests=src/client/__tests__,server/src/__tests__,src/shared/__tests__,tests
sonar.sourceEncoding=UTF-8

# Language & TypeScript configuration
sonar.language=ts
sonar.typescript.tsconfigPaths=tsconfig.app.json,tsconfig.server.json

# Test execution & LCOV coverage report paths
sonar.javascript.lcov.reportPaths=tests/coverage/client/lcov.info,tests/coverage/server/lcov.info

# Inclusions & Exclusions
sonar.inclusions=src/**,server/src/**
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,tests/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/public/**,**/test-results/**,**/coverage/**,**/*.config.*,**/*.d.ts,**/k8s/**,**/terraform/**,**/docs/**
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,src/client/pages/info/**,src/shared/constants/**

# Quality Gate requirements
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
