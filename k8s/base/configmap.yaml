apiVersion: v1
kind: ConfigMap
metadata:
  name: cartiva-config
  namespace: cartiva
  labels:
    app.kubernetes.io/name: cartiva-config
    app.kubernetes.io/part-of: cartiva-mall
data:
  NODE_ENV: 'production'
  PORT: '5001'
  CLIENT_URL: 'https://cartiva.mall'
  API_PREFIX: '/api/v1'
  LOG_LEVEL: 'info'
  RATE_LIMIT_WINDOW_MS: '900000'
  RATE_LIMIT_MAX: '1000'
