apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cartiva-api-hpa
  namespace: cartiva
  labels:
    app.kubernetes.io/name: cartiva-api-hpa
    app.kubernetes.io/part-of: cartiva-mall
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cartiva-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
      selectPolicy: Min
